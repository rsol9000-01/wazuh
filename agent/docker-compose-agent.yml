services:
  wazuh.agent:
    #image: wazuh/wazuh-agent:4.14.5
    build:
      context: .
      dockerfile: Dockerfile
    image: simovilab/wazuh-agent-docker:4.14.5
    pull_policy: build
    restart: always
    container_name: wazuh.agent
    # Respuesta activa con efecto real en srv-databus y srv-infobus (igual que el agente de srv-gestion):
    # firewall-drop escribe en el netfilter del namespace de red del
    # contenedor; para que sea el del host, el agente comparte la red del
    # host y recibe solo NET_ADMIN (no privileged). En este modo no aplica
    # "hostname:"; el nombre del agente va en WAZUH_AGENT_NAME.
    # El agente no necesita la red de la aplicación: lee logs y archivos
    # montados y consulta Docker por el socket.
    network_mode: host
    # SCA (CIS) del host: el agente ve el host para evaluar el servidor y no
    # la imagen del contenedor. pid: host + SYS_ADMIN + SYS_PTRACE permiten
    # correr los comandos de las politicas con nsenter en los namespaces del
    # host (PID 1); / montado en /host (solo lectura) sirve a los controles de
    # archivos. pid: host SOLO con la imagen construida desde agent/Dockerfile:
    # la imagen oficial (s6-overlay) mata al detenerse todos los procesos que
    # ve, y con pid: host son los del servidor; el Dockerfile quita ese paso.
    # Ver agent/sca_host.py y "Configuration assessment (CIS)" en el README.
    pid: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    #privileged: true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "1.0"
    #user: "1001:990"
    group_add:
      - "${DOCKER_GID}"
    environment:
      - WAZUH_MANAGER_SERVER=${REMOTE_AGENT_MANAGER_SERVER}
      - WAZUH_AGENT_GROUP=${REMOTE_AGENT_GROUP}
      - WAZUH_AGENT_NAME=${LOCAL_AGENT_HOSTNAME}
      - WAZUH_MANAGER_SERVER_PORT=1514
      - PROJECT_PATH=${PROJECT_PATH}
      - TZ=${TZ}
    volumes:
      - ../${CONFIG_AGENT_SCRIPT}:/init_01.sh:ro
      - wazuh_agent_etc:/var/ossec/etc
      - ../config/wazuh_cluster/authd.pass:/opt/authd.pass:ro
      - ./conf/ossec.conf:/opt/ossec.conf.tpl:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${PROJECT_PATH}:${PROJECT_PATH}:ro
      - /var/lib/docker/volumes/databus_feed_files/_data:/var/lib/docker/volumes/databus_feed_files/_data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      # Traefik access log (JSON). Wazuh reads it at /home/traefik/logs/access.log
      - ${TRAEFIK_LOGS_PATH:-/home/traefik/logs}:/home/traefik/logs:ro
      # Inventory of the server: operating system and dpkg packages of the
      # host (vulnerability detection). See agent/Dockerfile.
      - /etc/os-release:/etc/os-release:ro
      - /var/lib/dpkg:/var/lib/dpkg:ro
      - /:/host:ro
      #- /sys:/sys:ro
      #- /etc:/host/etc:ro
      #- /var/run:/var/run
      #- /sys:/sys:ro
      #- /proc:/proc:ro
      #- /proc:/proc:ro
      #- /dev:/dev:ro
      #- /proc/meminfo:/host_proc_meminfo:ro
    entrypoint: ["/init_01.sh", "${REMOTE_AGENT_MANAGER_SERVER}"]
    #depends_on:
    #  - wazuh.manager 
volumes:
  wazuh_agent_etc: